name: KIS read-only market data verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-market-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KIS_ENV: real
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_URL: ${{ secrets.KIS_URL }}
      DRY_RUN: 'Y'
      ENABLE_LIVE_ORDERS: 'NO'
      FORCE_BAA: 'N'
      GITHUB_STATE_MODE: off
      BOT_STATE_DIR: ${{ github.workspace }}/.kis-readonly-market-data
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify KIS quotes and historical market data (read-only)
        run: python ci/verify_kis_market_data.py
