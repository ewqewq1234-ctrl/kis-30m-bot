name: Dividend value read-only screen
on:
  workflow_call:
    inputs:
      max_symbols:
        type: string
        default: '0'
    secrets:
      KIS_APP_KEY:
        required: false
      KIS_APP_SECRET:
        required: false
      DART_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      max_symbols:
        description: '800 = resumable batch; 0 = full scan'
        default: '800'
        required: true
  schedule:
    - cron: '0 19 * * 1'  # Monday 19:00 UTC = Tuesday 04:00 KST; early scan.
    - cron: '0 21 * * 1'  # Monday 21:00 UTC = Tuesday 06:00 KST; final scan and publication.

permissions:
  contents: write

concurrency:
  group: dividend-value-read-only-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline automated-data screening rules and API boundary tests
        run: python ci/run_offline_tests.py test_dividend_value
      - uses: actions/cache/restore@v4
        with:
          path: .screen-cache
          key: dividend-value-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dividend-value-v1-
      - name: Restore persistent exclusion registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .screen-cache
          if git ls-remote --exit-code --heads origin dividend-screen-state >/dev/null 2>&1; then
            git fetch origin dividend-screen-state
            git show FETCH_HEAD:exclusion-registry.json > .screen-cache/exclusion-registry.json
          fi
      - name: Read official market data and disclosures (no account or order API)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # Scheduled scans use the full universe; manual runs default to
          # resumable 800-symbol batches. Workflow edits never start a scan.
          MAX_SYMBOLS: ${{ inputs.max_symbols || '0' }}
          PYTHONUNBUFFERED: '1'
        run: python -m dividend_value.screen --max-symbols "$MAX_SYMBOLS"
      - name: Persist exclusion registry (no screening results or credentials)
        if: always() && hashFiles('.screen-cache/exclusion-registry.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dividend-screen-state
          cp .screen-cache/exclusion-registry.json /tmp/dividend-screen-state/
          cd /tmp/dividend-screen-state
          git init -q
          git checkout --orphan dividend-screen-state
          git config user.name kis-bot
          git config user.email kis-bot@users.noreply.github.com
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add exclusion-registry.json
          git commit -m 'Persist verified screening exclusions'
          EXTRAHEADER="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)"
          test -n "$EXTRAHEADER"
          git -c http.extraheader="$EXTRAHEADER" push --force origin HEAD:refs/heads/dividend-screen-state
      - name: Publish complete Tuesday snapshot (no orders)
        if: github.event_name == 'schedule' && github.event.schedule == '0 21 * * 1'
        shell: bash
        run: |
          set -euo pipefail
          python -m dividend_value.publish
          if [ -f signal-publish/signals.json ]; then
            cd signal-publish
            git init -q
            git checkout --orphan dividend-signals
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git add signals.json
            git -c user.name=kis-bot -c user.email=kis-bot@users.noreply.github.com commit -m 'Tuesday verified dividend candidates'
            EXTRAHEADER="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)"
            test -n "$EXTRAHEADER"
            git -c http.extraheader="$EXTRAHEADER" push --force origin HEAD:refs/heads/dividend-signals
          else
            echo "Publication safely skipped: scan is incomplete or not eligible."
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .screen-cache
          key: dividend-value-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/dividend-value/**') != ''
        with:
          name: dividend-value-${{ github.run_id }}
          path: results/dividend-value/
          if-no-files-found: error
          retention-days: 30
