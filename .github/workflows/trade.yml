
name: KIS Bot Persistent State
on:
  workflow_dispatch:
  schedule:
    # Every weekday hour at minute 12, in Korean local time.
    - cron: '12 * * * 1-5'
      timezone: 'Asia/Seoul'

permissions:
  actions: read
  contents: write

concurrency:
  group: kis-bot-single-account
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_CANO: ${{ secrets.KIS_CANO }}
      KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KIS_ENV: real
      DRY_RUN: 'N'
      ENABLE_LIVE_ORDERS: 'YES'
      FORCE_BAA: 'N'
      BAA_MODE: ATTACK
      RUN_REPORT_ONLY: 'N'
      RUN_MIDDAY_REPORT: 'N'
      BOT_SCHEDULE_CRON: ${{ github.event.schedule || '' }}
      HOURLY_OPERATION: 'Y'
      GITHUB_STATE_MODE: git
      BOT_STATE_DIR: ${{ github.workspace }}/persistent_state

    steps:
      - name: Exit immediately outside weekday market/report hours
        id: runtime
        shell: bash
        run: |
          python3 - <<'PYGATE'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          active = now.weekday() < 5 and 9 <= now.hour < 17
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"active={str(active).lower()}\n")
          print(f"Actual KST time: {now.isoformat()}; active={active}")
          PYGATE

      - uses: actions/checkout@v4
        if: steps.runtime.outputs.active == 'true'
        with:
          persist-credentials: true

      - name: Initialize or fetch persistent state branch
        if: steps.runtime.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p persistent_state
          cd persistent_state
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch --depth=1 origin bot-state
            git checkout -B bot-state FETCH_HEAD
          else
            git checkout --orphan bot-state
            printf 'token_cache.json\n*.lock\n.bot.lock\n.tmp_*\n' > .gitignore
            git add .gitignore
            git -c user.name=kis-bot -c user.email=kis-bot@users.noreply.github.com commit -m 'Initialize persistent bot state'
            git push origin HEAD:refs/heads/bot-state
          fi

      - uses: actions/setup-python@v5
        if: steps.runtime.outputs.active == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.runtime.outputs.active == 'true'
      - run: python -m py_compile bot_once.py
        if: steps.runtime.outputs.active == 'true'
      - run: python -m unittest -v test_bot_once.py test_api_resilience.py test_one_share.py test_swing_strategy.py test_hourly_runtime.py
        if: steps.runtime.outputs.active == 'true'
        env:
          GITHUB_STATE_MODE: 'off'
          BOT_STATE_DIR: ${{ runner.temp }}/kis-offline-test-state
          KIS_ENV: demo
          KIS_URL: https://openapivts.koreainvestment.com:29443
          KIS_APP_KEY: offline-fake-key
          KIS_APP_SECRET: offline-fake-secret
          KIS_CANO: '12345678'
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          DRY_RUN: 'Y'
          ENABLE_LIVE_ORDERS: 'NO'
          FORCE_BAA: 'N'
          BAA_MODE: AUTO
          HOURLY_OPERATION: 'N'
          RUN_REPORT_ONLY: 'N'
          RUN_MIDDAY_REPORT: 'N'

      - name: Run bot (fail closed)
        if: steps.runtime.outputs.active == 'true'
        env:
          # Keep original logical slots for identity checks and report isolation.
          BOT_SCHEDULE_CRON: ${{ github.event.schedule || '' }}
          BOT_SCHEDULE_SLOT_KST: 'hourly'
          RUN_REPORT_ONLY: N
          RUN_MIDDAY_REPORT: N
        run: python bot_once.py

