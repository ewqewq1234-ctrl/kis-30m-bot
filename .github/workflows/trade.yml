name: KIS 15m Automated Trading Bot

on:
  schedule:
    # 1) 09:14 첫 기상 (5분 딜레이 감안 시 09:19 실행) -> UTC 00:14
    - cron: '14 0 * * 1-5'
    # 2) 09:30 ~ 14:45 (15분 주기 감시) -> UTC 00:30 ~ 05:45
    - cron: '30,45 0 * * 1-5'
    - cron: '0,15,30,45 1-5 * * 1-5'
    # 3) 15:05, 15:10 (정규장 1차 전량 시장가 청산) -> UTC 06:05, 06:10
    - cron: '5,10 6 * * 1-5'
    # 4) 15:45 (장후 시간외 종가 2차 강제 청산) -> UTC 06:45
    - cron: '45 6 * * 1-5'
    # 5) 16:05 (최종 당일 결산 썸머리) -> UTC 07:05
    - cron: '5 7 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: 한국 날짜 추출
        id: get-date
        run: echo "today=$(TZ='Asia/Seoul' date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: 토큰 캐시 복원
        uses: actions/cache@v4
        with:
          path: token_cache.json
          key: kis-token-${{ steps.get-date.outputs.today }}

      - name: 트레이딩 봇 실행
        env:
          KIS_URL: ${{ secrets.KIS_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_CANO: ${{ secrets.KIS_CANO }}
          KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Seoul"
        run: |
          TARGET=$(find . -name "bot_once.py" -type f | head -n 1)
          python "$TARGET"
