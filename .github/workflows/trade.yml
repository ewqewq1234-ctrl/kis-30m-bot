
name: KIS Bot Persistent State
on:
  workflow_dispatch:
  schedule:
    # Previous-day UTC Sunday-Thursday = Monday-Friday 08:52 KST.
    - cron: '52 23 * * 0-4'
    # Monday-Friday 09:00-13:50 KST, every 10 minutes.
    - cron: '*/10 0-4 * * 1-5'
    # Monday-Friday 14:00-14:50 KST, every 10 minutes.
    - cron: '*/10 5 * * 1-5'
    # Dedicated 14:53 KST settlement/report trigger.
    - cron: '53 5 * * 1-5'
    # Monday-Friday 15:00, 15:10, and 15:20 KST.
    - cron: '0,10,20 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: kis-bot-single-account
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_CANO: ${{ secrets.KIS_CANO }}
      KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KIS_ENV: real
      DRY_RUN: 'N'
      ENABLE_LIVE_ORDERS: 'YES'
      FORCE_BAA: 'N'
      GITHUB_STATE_MODE: git
      BOT_STATE_DIR: ${{ github.workspace }}/persistent_state

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Initialize or fetch persistent state branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p persistent_state
          cd persistent_state
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch --depth=1 origin bot-state
            git checkout -B bot-state FETCH_HEAD
          else
            git checkout --orphan bot-state
            printf 'token_cache.json\n*.lock\n.bot.lock\n.tmp_*\n' > .gitignore
            git add .gitignore
            git -c user.name=kis-bot -c user.email=kis-bot@users.noreply.github.com commit -m 'Initialize persistent bot state'
            git push origin HEAD:refs/heads/bot-state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile bot_once.py
      - run: python -m unittest -v test_bot_once.py test_api_resilience.py test_one_share.py test_swing_strategy.py
        env:
          GITHUB_STATE_MODE: 'off'

      - name: Run bot (fail closed)
        env:
          RUN_MIDDAY_REPORT: ${{ github.event_name == 'schedule' && (github.event.schedule == '*/10 5 * * 1-5' || github.event.schedule == '53 5 * * 1-5' || github.event.schedule == '0,10,20 6 * * 1-5') && 'Y' || 'N' }}
        run: python bot_once.py
