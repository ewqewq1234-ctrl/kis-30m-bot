name: Quant Trading Bot

on:
  schedule:
    - cron: '15-59/5 0 * * 1-5'
    - cron: '*/5 1-5 * * 1-5'
    - cron: '0-20/5 6 * * 1-5'
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
    inputs:
      force_baa:
        description: 'BAA 전략 강제 실행 여부 (Y/N)'
        required: false
        default: 'N'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packages
        run: pip install requests pytz

      - name: Restore States & History Cache
        uses: actions/cache@v4
        with:
          path: |
            token_cache.json
            day_state.json
            baa_state.json
            trade_history.json
          key: trading-state-${{ github.run_id }}
          restore-keys: |
            trading-state-

      - name: Execute bot_once.py
        env:
          KIS_URL: ${{ secrets.KIS_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_CANO: ${{ secrets.KIS_CANO }}
          KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 입력받은 변수를 파이썬 환경변수로 주입 (기본적으로 스케줄링 시에는 N으로 동작)
          FORCE_BAA: ${{ github.event.inputs.force_baa || 'N' }}
        run: python bot_once.py
