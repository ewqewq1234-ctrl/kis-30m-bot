name: KIS 30m Free Tier Bot

on:
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '0 1 * * 1-5'
    - cron: '30 1 * * 1-5'
    - cron: '0 2 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '0 5 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '15 6 * * 1-5'
  workflow_dispatch:

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 라이브러리 설치
      run: |
        pip install requests python-dotenv

    - name: 자동 탐색 매매 스크립트 실행
      env:
        KIS_URL: ${{ secrets.KIS_URL }}
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        KIS_CANO: ${{ secrets.KIS_CANO }}
        KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
        TZ: "Asia/Seoul"
      run: |
        TARGET=$(find . -name "bot_once.py" -type f | head -n 1)
        echo "발견된 실행 파일: $TARGET"
        python "$TARGET"
