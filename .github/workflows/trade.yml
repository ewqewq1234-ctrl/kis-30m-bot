name: Quant Trading Bot

on:
  schedule:
    # KST 09:15 ~ 15:20 (UTC 00:15 ~ 06:20) 장중 5분 주기 감시
    - cron: '15-59/5 0 * * 1-5'
    - cron: '*/5 1-5 * * 1-5'
    - cron: '0-20/5 6 * * 1-5'
    # KST 16:05 (UTC 07:05) 당일 결산 및 정밀 보고서 전송용 1회 실행
    - cron: '5 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # [수정] 루트 경로의 의존성 파일 탐색 오류 방지를 위해 캐시 옵션 제거

      - name: Install Packages
        run: pip install requests pytz

      - name: Restore States & History Cache
        uses: actions/cache@v4
        with:
          path: |
            token_cache.json
            day_state.json
            baa_state.json
            trade_history.json
          key: trading-state-${{ github.run_id }}
          restore-keys: |
            trading-state-

      - name: Execute bot_once.py
        env:
          KIS_URL: ${{ secrets.KIS_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_CANO: ${{ secrets.KIS_CANO }}
          KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_once.py
