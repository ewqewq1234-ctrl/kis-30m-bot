name: Quant Trading Bot

on:
  schedule:
    # 한국시간 09:15 ~ 15:20 (UTC 00:15 ~ 06:20) 5분 주기 실행
    - cron: '15-59/5 0 * * 1-5'
    - cron: '*/5 1-5 * * 1-5'
    - cron: '0-20/5 6 * * 1-5'
    # 16:05 (UTC 07:05) 당일 결산 및 마감 보고서 발송 전용
    - cron: '5 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Packages
        run: pip install requests pytz

      - name: 전략 상태 및 손익 히스토리 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            token_cache.json
            day_state.json
            baa_state.json
            trade_history.json
          key: trading-state-${{ github.run_id }}
          restore-keys: |
            trading-state-

      - name: Run bot_once.py
        env:
          KIS_URL: ${{ secrets.KIS_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_CANO: ${{ secrets.KIS_CANO }}
          KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_once.py
