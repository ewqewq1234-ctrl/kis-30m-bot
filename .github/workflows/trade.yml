
name: KIS Bot Persistent State
on:
  workflow_dispatch:
  schedule:
    # Request each original slot four hours early; execution latency is not guaranteed.
    - cron: '35 5 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '5 7 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '5 9 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '5 11 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '35 11 * * 1-5'
      timezone: 'Asia/Seoul'

permissions:
  actions: read
  contents: write

concurrency:
  group: kis-bot-single-account
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_CANO: ${{ secrets.KIS_CANO }}
      KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KIS_ENV: real
      DRY_RUN: 'N'
      ENABLE_LIVE_ORDERS: 'YES'
      FORCE_BAA: 'N'
      BAA_MODE: ATTACK
      RUN_REPORT_ONLY: 'N'
      RUN_MIDDAY_REPORT: 'N'
      BOT_SCHEDULE_CRON: ${{ github.event.schedule || '' }}
      GITHUB_STATE_MODE: git
      BOT_STATE_DIR: ${{ github.workspace }}/persistent_state

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Resolve scheduled slot
        id: schedule
        if: github.event_name == 'schedule'
        shell: bash
        env:
          BOT_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "$BOT_SCHEDULE_CRON" in
            '35 5 * * 1-5') slot='09:35'; report_only='N'; logical_cron='35 9 * * 1-5' ;;
            '5 7 * * 1-5') slot='11:05'; report_only='N'; logical_cron='5 11 * * 1-5' ;;
            '5 9 * * 1-5') slot='13:05'; report_only='N'; logical_cron='5 13 * * 1-5' ;;
            '5 11 * * 1-5') slot='15:05'; report_only='N'; logical_cron='5 15 * * 1-5' ;;
            '35 11 * * 1-5') slot='15:35'; report_only='Y'; logical_cron='35 15 * * 1-5' ;;
            *) echo "Unrecognized scheduled cron; refusing to start bot." >&2; exit 1 ;;
          esac
          printf 'kst_slot=%s\nreport_only=%s\nlogical_cron=%s\n' "$slot" "$report_only" "$logical_cron" >> "$GITHUB_OUTPUT"

      - name: Record trigger creation and runner start times
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          BOT_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          created_at="$(gh api "repos/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}" --jq '.created_at')"
          runner_started_at="$(gh api "repos/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}/jobs" --jq '[.jobs[] | select(.name == "trade") | .started_at] | first')"
          if [[ -z "$created_at" || "$created_at" == "null" \
                || -z "$runner_started_at" || "$runner_started_at" == "null" ]]; then
            echo "Missing workflow creation/start timestamp; refusing to continue." >&2
            exit 1
          fi
          printf 'BOT_RUN_CREATED_AT=%s\nBOT_RUN_STARTED_AT=%s\n' \
            "$created_at" "$runner_started_at" >> "$GITHUB_ENV"
          echo "Scheduled event: cron=$BOT_SCHEDULE_CRON run_id=$GH_RUN_ID created_at=$created_at runner_started_at=$runner_started_at"

      - name: Initialize or fetch persistent state branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p persistent_state
          cd persistent_state
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch --depth=1 origin bot-state
            git checkout -B bot-state FETCH_HEAD
          else
            git checkout --orphan bot-state
            printf 'token_cache.json\n*.lock\n.bot.lock\n.tmp_*\n' > .gitignore
            git add .gitignore
            git -c user.name=kis-bot -c user.email=kis-bot@users.noreply.github.com commit -m 'Initialize persistent bot state'
            git push origin HEAD:refs/heads/bot-state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m py_compile bot_once.py
      - run: python -m unittest -v test_bot_once.py test_api_resilience.py test_one_share.py test_swing_strategy.py
        env:
          GITHUB_STATE_MODE: 'off'
          BOT_STATE_DIR: ${{ runner.temp }}/kis-offline-test-state
          KIS_ENV: demo
          KIS_URL: https://openapivts.koreainvestment.com:29443
          KIS_APP_KEY: offline-fake-key
          KIS_APP_SECRET: offline-fake-secret
          KIS_CANO: '12345678'
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          DRY_RUN: 'Y'
          ENABLE_LIVE_ORDERS: 'NO'
          FORCE_BAA: 'N'
          BAA_MODE: AUTO
          RUN_REPORT_ONLY: 'N'
          RUN_MIDDAY_REPORT: 'N'

      - name: Run bot (fail closed)
        env:
          # Keep original logical slots for identity checks and report isolation.
          BOT_SCHEDULE_CRON: ${{ steps.schedule.outputs.logical_cron || '' }}
          BOT_SCHEDULE_SLOT_KST: ${{ steps.schedule.outputs.kst_slot || '' }}
          RUN_REPORT_ONLY: ${{ steps.schedule.outputs.report_only || 'N' }}
          RUN_MIDDAY_REPORT: ${{ steps.schedule.outputs.report_only || 'N' }}
        run: python bot_once.py
