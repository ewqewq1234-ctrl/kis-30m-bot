name: KIS 15m Automated Trading Bot

on:
  schedule:
    # 1) 평일 09:00 ~ 15:00 (15분 간격 매매 감시) -> UTC 00:00 ~ 06:00
    - cron: '0,15,30,45 0-5 * * 1-5'
    # 2) 평일 15:15 (장 마감 전량 청산) -> UTC 06:15
    - cron: '15 6 * * 1-5'
    # 3) 평일 16:00 (당일 주식시장 거래 썸머리 결산 리포트) -> UTC 07:00
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: 한국 기준 당일 날짜 추출
        id: get-date
        run: |
          echo "today=$(TZ='Asia/Seoul' date +'%Y%m%d')" >> $GITHUB_OUTPUT

      # 당일 발급받은 KIS 토큰 캐시 복원/저장 (하루 1회 발급 보장)
      - name: KIS 일일 접근 토큰 캐시
        uses: actions/cache@v4
        with:
          path: token_cache.json
          key: kis-token-${{ steps.get-date.outputs.today }}

      - name: 트레이딩 봇 실행
        env:
          KIS_URL: ${{ secrets.KIS_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_CANO: ${{ secrets.KIS_CANO }}
          KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Seoul"
        run: |
          TARGET=$(find . -name "bot_once.py" -type f | head -n 1)
          echo "발견된 실행 파일: $TARGET"
          python "$TARGET"
