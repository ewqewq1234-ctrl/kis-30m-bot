name: Offline Ubuntu regression

on:
  workflow_dispatch:
    inputs:
      run_dividend_screen:
        description: 'Also run the read-only market screen with repository API secrets'
        type: boolean
        default: false
      max_symbols:
        description: 'Screen batch size; 0 = all (up to 330 minutes)'
        type: string
        default: '0'
  push:
    paths:
      - '*.py'
      - 'ci/**'
      - 'dividend_value/**'
      - 'portfolio.json'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '*.py'
      - 'ci/**'
      - 'dividend_value/**'
      - 'portfolio.json'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  optional-read-only-screen:
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && inputs.run_dividend_screen
    uses: ./.github/workflows/dividend-value-screen.yml
    with:
      max_symbols: ${{ inputs.max_symbols || '0' }}
    secrets:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, proposed]
    env:
      DRY_RUN: 'Y'
      ENABLE_LIVE_ORDERS: 'NO'
      FORCE_BAA: 'N'
      GITHUB_STATE_MODE: 'off'
      BOT_STATE_DIR: ${{ github.workspace }}/offline-state
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: proposed
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.source == 'baseline'
        with:
          ref: f2654b52013add12dcfdde18ea1be30d1508ecf5
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r proposed/requirements.txt
      - name: Verify Linux tools
        run: git --version && openssl version
      - name: Baseline full regression
        if: matrix.source == 'baseline'
        run: python proposed/ci/run_offline_tests.py --source baseline test_bot_once test_api_resilience
      - name: Proposed full regression
        if: matrix.source == 'proposed'
        run: python proposed/ci/run_offline_tests.py --source proposed test_bot_once test_api_resilience test_one_share test_swing_strategy test_hourly_runtime test_strategy_retirement test_dividend_value test_dividend_trading

